<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
</head>
<body>
    <h1>Unit Converter</h1>

       <form action="/convert" method="GET">
    <div style="display:flex; flex-direction: column; gap:15px;">
        <div>
            <label>Enter Value to Convert:</label>
            <input type="number" name="value" /> <!-- Yeh name="value" hona zaroori hai -->
        </div>
        <div>
            <label>Unit to convert From:</label>
            <input type="text" name="from" /> <!-- Yeh name="from" hona zaroori hai -->
        </div>
        <div>
            <label>Unit to convert To:</label>
            <input type="text" name="to" /> <!-- Yeh name="to" hona zaroori hai -->
        </div>
        <div>
            <button type="submit" style="height: 30px; width: 70px;">Convert</button>
        </div>
    </div>
</form>
</body>
</html>
